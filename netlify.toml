[build]
  command = "npm run build"
  publish = "dist"

# Security headers. The enforced CSP only blocks framing, plugins, and base
# tag hijacks. The full policy runs report only until the browser console
# shows no violations on the home, story, admin, and judging pages; then
# move it into Content-Security-Policy.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clerk.accounts.dev https://clerk.vibeapps.dev https://challenges.cloudflare.com https://app.rybbit.io https://cdn-cookieyes.com; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://*.convex.site https://*.clerk.accounts.dev https://clerk.vibeapps.dev https://app.rybbit.io https://*.cookieyes.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src https://challenges.cloudflare.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.loom.com; worker-src 'self' blob:; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"

# Cache rules. Only Cache-Control is set here, so the security headers
# above always apply. Vite emits content hashed files to /assets, so they
# never change in place. Icons are listed one by one so the SPA fallback
# is never cached under a near miss name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/android-chrome-192x192.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

