[[edge_functions]]
path = "/s/*"
function = "botMeta"

[[edge_functions]]
path = "/judging/*/submit"
function = "submitMeta"


# Serves raster uploads for the Image CDN; see public/_redirects /_img rules
[[edge_functions]]
path = "/_src/*"
function = "imageSource"
